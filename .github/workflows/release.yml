name: Release

# The .fpk is built locally and committed to dist/, because `fnpack` is a
# proprietary tool that ships with fnOS and is not available on GitHub runners.
# This workflow therefore does not build anything: on a version tag it simply
# publishes the committed artifact as a GitHub Release asset.
#
# Release procedure:
#   1. bump `version` in package/manifest (and VERSION in fancontrold.py)
#   2. ./build-fpk.sh
#   3. commit dist/fn-fancontrol-<version>.fpk
#   4. git tag v<version> && git push --tags

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the manifest
        id: manifest
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
                     package/manifest | head -n1 | tr -d '\r' | tr -d '[:space:]')"
          test -n "$version" || { echo "::error::no version in package/manifest"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version: $version"

      - name: Verify the committed artifact matches
        run: |
          set -euo pipefail
          fpk="dist/fn-fancontrol-${{ steps.manifest.outputs.version }}.fpk"
          if [ ! -f "$fpk" ]; then
            echo "::error::$fpk is missing. Run ./build-fpk.sh and commit it."
            exit 1
          fi
          inside="$(tar xzf "$fpk" -O manifest \
                    | sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
                    | head -n1 | tr -d '\r' | tr -d '[:space:]')"
          if [ "$inside" != "${{ steps.manifest.outputs.version }}" ]; then
            echo "::error::package contains version $inside, expected ${{ steps.manifest.outputs.version }}"
            exit 1
          fi
          echo "$fpk is consistent (version $inside)"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fn-fancontrol-*.fpk
          generate_release_notes: true
          fail_on_unmatched_files: true
